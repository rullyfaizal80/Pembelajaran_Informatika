<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;

            background-color: white;
            border: 1px solid #dddddd;
            border-radius: 8px;
            padding: 14px 16px;

        a.item .angka {

        <p class="deskripsi">Klik salah satudi bawah untuk membuka contohnya. Setiap file fokus pada satu topik saja</p>
