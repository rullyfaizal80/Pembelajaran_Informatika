<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>2. Card</title>
<style>

  body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    color: #222222;
    margin: 0;
    padding: 30px;
  }

  h1 { font-size: 22px; }
  p { color: #555555; }

  /* link kembali ke halaman daftar isi */
  a.kembali {
    display: inline-block;
    margin-top: 24px;
    color: #2e7d52;
    text-decoration: none;
    font-size: 14px;
  }
  a.kembali:hover {
    text-decoration: underline;
  }

  /* ======================================
     CARD
     Konsep yang dipakai:
     - border -> garis tepi kotak
     - border-radius -> membuat sudut kotak melengkung
     - box-shadow -> bayangan agar terlihat "terangkat"
     - transition -> membuat perubahan hover jadi halus
  ====================================== */

  .card {
    width: 220px;
    background-color: white;
    border: 1px solid #dddddd;
    border-radius: 10px;
    overflow: hidden;         /* agar gambar mengikuti sudut melengkung */
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);

    transition: transform 0.2s ease; /* animasi halus saat hover */
  }

  /* efek naik sedikit saat kursor diarahkan ke card */
  .card:hover {
    transform: translateY(-6px);
  }

  .card .gambar {
    height: 100px;
    background-color: #2e7d52;  /* pengganti gambar sungguhan */
  }

  .card .isi {
    padding: 14px;
  }

  .card .isi h3 {
    margin: 0 0 6px 0;
    font-size: 16px;
  }

  .card .isi p {
    margin: 0;
    font-size: 14px;
  }

</style>
</head>
<body>

  <h1>2. Praktik Card</h1>
  <p>Arahkan kursor ke kartu di bawah ini, perhatikan efek naik dan bayangannya.</p>

  <div class="card">
    <div class="gambar"></div>
    <div class="isi">
      <h3>Judul Card</h3>
      <p>Ini contoh deskripsi singkat di dalam card.</p>
    </div>
  </div>

  <a class="kembali" href="index.html">&larr; Kembali ke daftar isi</a>

</body>
</html>
