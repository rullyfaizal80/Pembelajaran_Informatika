<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Note</title>
</head>
<body>
    <div class="box">
        <h2>Catatan Saya</h2>
        <div class="input-grup">
            <input type="text" id="catatan" placeholder="Isi kegiatan.....">
            <button onclick="tambahCatatan()">Tambah</button>
        </div>
        <ul id="daftar"></ul>
    </div>
    <script>
        let catatan = [];

        function tambahCatatan() {
            let input = document.getElementById("catatan").value;
            catatan.push(input);
            tampilkan();
        }

        function tampilkan() {
            let list = "";
            for (let i = 0; i < catatan.length; i++) {
                list += "<li>" + catatan[i] + "</li>"; 
            }
            document.getElementById("daftar").innerHTML = list;
        }
    </script>
</body>
</html>
