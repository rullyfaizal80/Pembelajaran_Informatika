<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan CSS Pertamaku</title>
    <style>
        body {
            background-color: lightblue;
        }
        h1 {
            color: darkblue;
            font-family: 'Comic Sans MS', cursive;
            font-size: 40px;
            text-align: center;
        }
        p {
            color: green;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size: 18px;
            text-align: justify;
        }
    </style>
</head>
<body>
    <h1>Selamat Datang di Web Pertamaku</h1>
    <p>Ini adalah paragraf pertamaku. Dengan CSS, teks ini jadi warna hijau, dan latar belakangnya jadi biru muda. Keren kan?</p>
</body>
</html>
