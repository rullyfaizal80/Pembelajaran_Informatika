<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktik: 4 Pilihan Tema</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 100px;
            background-color: #ffffff;
            color: #333333;
            transition: background-color 0.3s, color 0.3s;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 30px;
            border: 2px solid #333;
            background: #ffffff;
            color: #333;
            font-weight: bold;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        /* Tema 2: Gelap */
        body.dark-mode {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        body.dark-mode button {
            background: #ffffff;
            color: #1a1a1a;
            border-color: #ffffff;
        }

        /* Tema 3: Biru (Ocean) */
        body.ocean-mode {
            background-color: #e0f2fe;
            color: #0369a1;
        }
        body.ocean-mode button {
            background: #0284c7;
            color: #ffffff;
            border-color: #0369a1;
        }

        /* Tema 4: Hijau (Forest) */
        body.forest-mode {
            background-color: #ecfdf5;
            color: #047857;
        }
        body.forest-mode button {
            background: #10b981;
            color: #ffffff;
            border-color: #047857;
        }
    </style>
</head>
<body>

    <h1>Pengaturan 4 Tema</h1>
    <p>Klik tombol di bawah untuk memutar pilihan warna tema.</p>
    <button id="tombolTema">Ganti Tema</button>

    <script>
        const tombol = document.getElementById('tombolTema');
        
        // Daftar kelas CSS dan teks tombol untuk setiap tema
        const daftarTema = [
            { kelas: '', teks: 'Tema: Terang' },
            { kelas: 'dark-mode', teks: 'Tema: Gelap' },
            { kelas: 'ocean-mode', teks: 'Tema: Biru' },
            { kelas: 'forest-mode', teks: 'Tema: Hijau' }
        ];

        let indeksAktif = 0;

        tombol.addEventListener('click', function() {
            // Hapus semua kelas tema yang ada di body terlebih dahulu
            document.body.className = '';

            // Pindah ke indeks berikutnya, jika sudah di ujung, kembali ke 0
            indeksAktif = (indeksAktif + 1) % daftarTema.length;

            // Ambil data tema berdasarkan indeks baru
            const temaBaru = daftarTema[indeksAktif];

            // Pasang kelas jika ada (bukan string kosong) dan ubah teks tombol
            if (temaBaru.kelas !== '') {
                document.body.classList.add(temaBaru.kelas);
            }
            tombol.innerText = temaBaru.teks;
        });
    </script>
</body>
</html>
