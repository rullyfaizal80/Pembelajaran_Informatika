<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game BGK</title>
    <style>
        body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #74ebd5, #acb6e5);
}

.container {
  width: 320px;
  margin: 80px auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

h1 {
  margin-bottom: 20px;
}

.buttons button {
  font-size: 30px;
  padding: 15px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.buttons button:hover {
  transform: scale(1.2);
  background: #e3f2fd;
}

#hasil {
  font-size: 18px;
  margin-top: 15px;
}

#skor {
  font-weight: bold;
  margin-top: 10px;
}

.reset {
  margin-top: 20px;
  padding: 10px;
  border: none;
  background: #ff6b6b;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

.reset:hover {
  background: #ff3b3b;
}
    </style>
</head>
<body>
   <div class="container">
    <h1>🎮 Batu Gunting Kertas</h1>

    <div class="buttons">
      <button onclick="main('batu')">🥌</button>
      <button onclick="main('gunting')">✂️</button>
      <button onclick="main('kertas')">📄</button>
    </div>

    <div id="info">
      <p id="hasil">Silakan pilih!</p>
      <p id="skor">Skor: 0 - 0</p>
    </div>

    <button class="reset" onclick="resetSkor()">Reset Game</button>
  </div>


    <script>
        let skorUser = 0;
let skorKomputer = 0;

function pilihanKomputer() {
  let pilihan = ['batu', 'gunting', 'kertas'];
  return pilihan[Math.floor(Math.random() * 3)];
}

function main(pilihanUser) {
  let komputer = pilihanKomputer();
  let hasil = "";

  if (pilihanUser === komputer) {
    hasil = "🤝 Seri!";
    document.getElementById("hasil").style.color = "black";
  } else if (
    (pilihanUser === 'batu' && komputer === 'gunting') ||
    (pilihanUser === 'gunting' && komputer === 'kertas') ||
    (pilihanUser === 'kertas' && komputer === 'batu')
  ) {
    hasil = "🎉 Kamu Menang!";
    skorUser++;
    document.getElementById("hasil").style.color = "green";
  } else {
    hasil = "😢 Kamu Kalah!";
    skorKomputer++;
    document.getElementById("hasil").style.color = "red";
  }

  document.getElementById("hasil").innerHTML =
    `Kamu: ${pilihanUser} | Komputer: ${komputer} <br>${hasil}`;

  document.getElementById("skor").innerHTML =
    `Skor: ${skorUser} - ${skorKomputer}`;
}

function resetSkor() {
  skorUser = 0;
  skorKomputer = 0;

  document.getElementById("skor").innerHTML = "Skor: 0 - 0";
  document.getElementById("hasil").innerHTML = "Silakan pilih!";
  document.getElementById("hasil").style.color = "black";
}
    </script>
</body>
</html>
