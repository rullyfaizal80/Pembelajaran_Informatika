<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktik: Dark Mode Sederhana</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 100px;
            background-color: #ffffff;
            color: #333333;
            transition: background-color 0.3s, color 0.3s;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 30px;
            border: 2px solid #333;
            background: #ffffff;
            color: #333;
            font-weight: bold;
        }
        body.dark-mode {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        body.dark-mode button {
            background: #ffffff;
            color: #1a1a1a;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <h1>Pengaturan Tema Sederhana</h1>
    <p>Klik tombol di bawah untuk mengganti warna latar belakang.</p>
    <button id="tombolTema">Mode Gelap</button>

    <script>
        const tombol = document.getElementById('tombolTema');

        tombol.addEventListener('click', function() {
            // Memasang atau mencopot kelas dark-mode pada body
            document.body.classList.toggle('dark-mode');
            
            // Mengubah teks pada tombol sesuai kondisi saat ini
            if (document.body.classList.contains('dark-mode')) {
                tombol.innerText = 'Mode Terang';
            } else {
                tombol.innerText = 'Mode Gelap';
            }
        });
    </script>
</body>
</html>
