<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>5. Grid</title>
<style>

  body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    color: #222222;
    margin: 0;
    padding: 30px;
  }

  h1 { font-size: 22px; }
  h2 { font-size: 16px; margin-top: 30px; }
  p { color: #555555; }

  .kotak {
    background-color: #2e7d52;
    color: white;
    padding: 16px;
    border-radius: 6px;
    text-align: center;
  }

  /* link kembali ke halaman daftar isi */
  a.kembali {
    display: inline-block;
    margin-top: 24px;
    color: #2e7d52;
    text-decoration: none;
    font-size: 14px;
  }
  a.kembali:hover {
    text-decoration: underline;
  }

  /* ======================================
     CSS GRID
     Konsep yang dipakai:
     - display: grid -> mengaktifkan mode grid
     - grid-template-columns -> menentukan jumlah & lebar kolom
     - gap -> jarak antar kotak
  ====================================== */

  /* Contoh 1: grid 3 kolom sama besar */
  .contoh-1 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;  /* 3 kolom sama lebar */
    gap: 10px;
  }

  /* Contoh 2: grid dengan lebar kolom berbeda */
  .contoh-2 {
    display: grid;
    grid-template-columns: 2fr 1fr;  /* kolom pertama 2x lebih lebar */
    gap: 10px;
  }

  /* Contoh 3: grid 2 baris x 2 kolom */
  .contoh-3 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 60px 60px;
    gap: 10px;
  }

</style>
</head>
<body>

  <h1>5. Praktik CSS Grid</h1>
  <p>Grid dipakai untuk menyusun elemen dalam bentuk baris dan kolom sekaligus.</p>

  <h2>Contoh 1: 3 kolom sama besar</h2>
  <div class="contoh-1">
    <div class="kotak">1</div>
    <div class="kotak">2</div>
    <div class="kotak">3</div>
  </div>

  <h2>Contoh 2: kolom dengan lebar berbeda (2fr dan 1fr)</h2>
  <div class="contoh-2">
    <div class="kotak">Lebar 2</div>
    <div class="kotak">Lebar 1</div>
  </div>

  <h2>Contoh 3: 2 baris x 2 kolom</h2>
  <div class="contoh-3">
    <div class="kotak">1</div>
    <div class="kotak">2</div>
    <div class="kotak">3</div>
    <div class="kotak">4</div>
  </div>

  <a class="kembali" href="index.html">&larr; Kembali ke daftar isi</a>

</body>
</html>
